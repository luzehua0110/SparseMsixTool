name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test tests/MsixTool.Tests/MsixTool.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Publish (AOT)
        run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishAot=true -o publish-aot
      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: msixtool-aot
          path: publish-aot/msixtool.exe
